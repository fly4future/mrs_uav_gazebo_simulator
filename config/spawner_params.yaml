mrs_drone_spawner:
  ros__parameters:
    mavlink_config:
      vehicle_base_port: 14000
      stream_for_qgc: true

    gazebo_models:
      spacing: 5.0 # for randomized spawn poses
      default_robot_name: 'uav'
    
    jinja_templates:
      save_rendered_sdf: true
      suffix: '.sdf.jinja'

    firmware_launch_delay: 0.0 # [s] extra delay before launching the firmware, blocks the spawner meanwhile
    sensor_wait_timeout: 30.0 # [s] launch the firmware even if the model's sensors do not publish by then
    
    extra_resource_paths: []

    tf_static_publisher:
      base_frame: "fcu"
      ignored_sensor_frames: ["air_pressure_sensor", "magnetometer_sensor", "navsat_sensor", "imu_sensor"]
